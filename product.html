<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Product | IKKO DIGITAL</title>
    <link rel="stylesheet" href="style.css?v=13.0">
    <!-- Firebase SDKs for fast parallel loading and caching -->
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <!-- Meta Pixel Code -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1039324625032380');
    fbq('init', '1790061685763294');
    fbq('track', 'PageView');
    </script>
    <noscript>
        <img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=1039324625032380&ev=PageView&noscript=1"/>
        <img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=1790061685763294&ev=PageView&noscript=1"/>
    </noscript>
    <!-- End Meta Pixel Code -->
</head>
<body>

    <!-- Header will be rendered here by app-core.js?v=3300.0 -->
    <div id="header-placeholder"></div>

    <!-- Top Green Announcement Bar -->
    <div class="pdp-top-announcement">
        ⚡ FLASH COMBO DEAL · EXTRA SAVINGS ACTIVE · LIMITED TIME ONLY ⚡
    </div>

    <main class="pdp-container">
        <!-- Main Product Information Grid -->
        <div id="product-details-container">
            <!-- Loading indicator/Dynamic content -->
            <div class="pdp-loading">Loading product details...</div>
        </div>

        <!-- Related Products Section -->
        <section class="storefront-section" style="margin-top: 50px;">
            <h2 class="pdp-specs-title" style="text-align: center; font-size: 1.4rem; font-weight: 800; margin-bottom: 24px; color: #111827;">Related Products You May Like</h2>
            <div class="products-grid-container" id="related-products-grid">
                <!-- Related products will populate here -->
            </div>
        </section>
    </main>

    <!-- Footer will be rendered here by app-core.js?v=3300.0 -->
    <div id="footer-placeholder"></div>

    <!-- Core Scripts -->
    <script src="app-core.js?v=3300.0"></script>
    <script>
        let selectedProduct = null;
        let pdpTimerSeconds = 901; // 15:01

        function startPDPTimer() {
            setInterval(() => {
                if (pdpTimerSeconds > 0) {
                    pdpTimerSeconds--;
                    const mins = Math.floor(pdpTimerSeconds / 60);
                    const secs = pdpTimerSeconds % 60;
                    const timerElem = document.getElementById('pdp-timer-count');
                    if (timerElem) {
                        timerElem.innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                    }
                }
            }, 1000);
        }

        async function handleBuyNowPDP() {
            if (!selectedProduct) return;
            await addToCart(selectedProduct.id, 1);
            window.location.href = 'checkout.html';
        }

        async function renderPDP() {
            const container = document.getElementById('product-details-container');
            if (!container) return;

            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');
            let products = await getProducts();
            products = products.map(p => {
                if (p.title) p.title = p.title.replace(/\u00a0/g, ' ').replace(/&nbsp;/g, ' ');
                if (p.description) p.description = p.description.replace(/\u00a0/g, ' ').replace(/&nbsp;/g, ' ');
                return p;
            });
            
            selectedProduct = products.find(p => String(p.id) === String(productId));
            if (!selectedProduct) {
                selectedProduct = products[0];
            }

            // Set page title
            document.title = `${selectedProduct.title} | JioMart`;

            const priceNum = parsePrice(selectedProduct.price) || 499;
            const compareNum = parsePrice(selectedProduct.comparePrice) || 1099;
            const percentSaved = Math.round(((compareNum - priceNum) / compareNum) * 100) || 55;

            container.innerHTML = `
                <!-- Breadcrumbs -->
                <div class="pdp-breadcrumbs">
                    <a href="index.html">Home</a> &rsaquo; 
                    <a href="index.html?tab=grocery-combos">Combo Offers</a> &rsaquo; 
                    <span>${selectedProduct.title}</span>
                </div>

                <!-- 2-Column Jubimart PDP Layout -->
                <div class="pdp-layout-grid">
                    <!-- Left Image Column -->
                    <div class="pdp-left-col">
                        <div class="pdp-image-card">
                            ${selectedProduct.badge ? `<span class="pdp-discount-badge">${selectedProduct.badge}</span>` : `<span class="pdp-discount-badge">${percentSaved}% Off</span>`}
                            <img src="${selectedProduct.image}" id="pdp-large-img" alt="${selectedProduct.title}">
                            <div class="pdp-image-bottom-tag">🛡️ 100% Genuine</div>
                        </div>
                        <div class="pdp-trust-bar">
                            🛡️ Trusted by 1M+ customers · Safe & Secure Payments
                        </div>
                    </div>

                    <!-- Right Info Column -->
                    <div class="pdp-right-col">
                        <h1 class="pdp-product-title">${selectedProduct.title}</h1>
                        
                        <div class="pdp-ratings-row">
                            <span class="star-pill">★ ${selectedProduct.rating || '4.5'}</span>
                            <span class="rating-text">· ${selectedProduct.reviewCount ? selectedProduct.reviewCount.toLocaleString() : '2,165'}+ ratings</span>
                            <span class="bought-text">👥 128 bought today</span>
                        </div>

                        <div class="pdp-price-box">
                            <span class="pdp-main-price">${selectedProduct.price}</span>
                            <span class="pdp-compare-price">${selectedProduct.comparePrice}</span>
                            ${selectedProduct.badge ? `<span class="pdp-save-badge">${selectedProduct.badge}</span>` : `<span class="pdp-save-badge">${percentSaved}% Off</span>`}
                            <div class="pdp-tax-note">(Inclusive of all taxes)</div>
                        </div>

                        <!-- Timer Countdown Box -->
                        <div class="pdp-timer-box">
                            <span class="timer-icon">⏰</span>
                            <span>Offer ends in <strong id="pdp-timer-count">15:01</strong></span>
                        </div>

                        <!-- Stock Scarcity Box -->
                        <div class="pdp-stock-box">
                            <span class="stock-icon">⚠️</span>
                            <span>Hurry! Only <strong class="text-red">7 units</strong> left in stock</span>
                        </div>

                        <!-- 4 Feature Pills Grid -->
                        <div class="pdp-features-grid-2x2">
                            <div class="pdp-feat-pill">
                                <span class="feat-ico">🚚</span>
                                <span>Delivery in 4 hours</span>
                            </div>
                            <div class="pdp-feat-pill">
                                <span class="feat-ico">🔄</span>
                                <span>7-Day Easy Returns</span>
                            </div>
                            <div class="pdp-feat-pill">
                                <span class="feat-ico">🛡️</span>
                                <span>100% Genuine Product</span>
                            </div>
                            <div class="pdp-feat-pill">
                                <span class="feat-ico">🔒</span>
                                <span>Secure Checkout</span>
                            </div>
                        </div>

                        <!-- Big Green BUY NOW Button -->
                        <button class="pdp-buy-now-btn" onclick="handleBuyNowPDP()">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                            BUY NOW · SAVE MORE
                        </button>

                        <!-- Payment Security Subtext -->
                        <div class="pdp-payment-trust-notes">
                            <p class="pay-note-line">💳 Pay via UPI, Cards, Net Banking, Wallets | 🔒 SSL Encrypted</p>
                            <p class="pay-note-line">🔒 We do not store card details · 100% secure payment</p>
                        </div>
                    </div>
                </div>
            `;

            await renderRelatedProducts();
            startPDPTimer();
        }

        async function renderRelatedProducts() {
            const grid = document.getElementById('related-products-grid');
            if (!grid) return;

            const products = await getProducts();
            const related = products.filter(p => p.id !== selectedProduct.id && !p.hiddenOnWebsite).slice(0, 4);

            grid.innerHTML = related.map(p => {
                const priceNum = parsePrice(p.price) || 499;
                const compareNum = parsePrice(p.comparePrice) || 1099;
                const percentSaved = Math.round(((compareNum - priceNum) / compareNum) * 100) || 55;

                return `
                    <article class="product-card" id="card-${p.id}">
                        <a href="product.html?id=${p.id}" class="product-card-img-wrapper">
                            ${p.badge ? `<span class="card-badge-sale">${p.badge}</span>` : `<span class="card-badge-sale">${percentSaved}% Off</span>`}
                            <div class="card-badge-timer">⚡ 4 hours</div>
                            <img src="${p.image}" alt="${p.title}" loading="lazy">
                        </a>
                        <div class="product-card-info">
                            <h2 class="product-card-title">
                                <a href="product.html?id=${p.id}">${p.title}</a>
                            </h2>
                            <div class="card-rating-row">
                                <span class="stars-gold">★★★★★</span>
                                <span class="rating-count">(${p.reviewCount || '2,165'})</span>
                            </div>
                            <div class="product-card-prices">
                                <span class="product-card-sale-price">${p.price}</span>
                                <span class="product-card-compare-price">${p.comparePrice}</span>
                                <span class="discount-pill">${p.badge || percentSaved + '% Off'}</span>
                            </div>
                            <div class="delivery-tag">🚚 Free delivery</div>
                            <div class="product-card-actions">
                                <button class="add-to-cart-btn" onclick="addToCart('${p.id}'); event.stopPropagation();">
                                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="#0c831f" stroke-width="2" fill="none"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                                    Add to cart
                                </button>
                            </div>
                        </div>
                    </article>
                `;
            }).join('');
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderPDP();
        });
        window.addEventListener('products-synced', () => {
            renderPDP();
        });
    </script>
</body>
</html>
